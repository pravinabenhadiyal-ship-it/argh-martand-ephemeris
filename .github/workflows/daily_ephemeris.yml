name: Build 1-Year NSE Swiss Ephemeris

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2026-11-25'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2027-11-30'

permissions:
  contents: write

jobs:
  build-ephemeris:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate 1-Year Sidereal Lahiri Ephemeris
        run: python generate_ephemeris.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"

      - name: Commit 1-year ephemeris file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nse_ephemeris_2026_2027.md
          git diff --staged --quiet || git commit -m "Generate 1-Year NSE Swiss Ephemeris (2026-2027)"
          git push
